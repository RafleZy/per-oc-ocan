name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK with Capacitor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Install npm dependencies
        run: |
          npm install

      - name: Ensure Capacitor Android platform is ready
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "android/gradlew not found. Generating fresh Android platform with Capacitor..."
            rm -rf android
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android
          if [ ! -f "gradlew" ]; then
            echo "Generating Gradle wrapper..."
            gradle wrapper
          fi
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: OC-Editor-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
